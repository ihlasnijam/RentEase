// ── build.gradle (Module: app) ─────────────────────────────────────────────
// Add these inside your dependencies { } block

dependencies {

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'

    // Firebase (add when you're ready to connect)
    // implementation platform('com.google.firebase:firebase-bom:32.7.0')
    // implementation 'com.google.firebase:firebase-auth-ktx'
    // implementation 'com.google.firebase:firebase-firestore-ktx'
    // implementation 'com.google.firebase:firebase-storage-ktx'
    // implementation 'com.google.firebase:firebase-messaging-ktx'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// ── Also make sure your android block has: ─────────────────────────────────
android {
    compileSdk 34

    defaultConfig {
        minSdk 24          // supports Android 7+ — covers 97% of devices
        targetSdk 34
    }

    buildFeatures {
        viewBinding true   // optional but recommended — cleaner than findViewById
    }
}
